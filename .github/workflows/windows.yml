name: Windows portable build
on:
  push:
    branches: [main]
    paths-ignore: [docs/VALIDATION.md]
  pull_request:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the portable build and AI pack (about 870 MB; counts against the Actions storage quota)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the local build script parses
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/tools/Build-Local.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; throw 'tools/Build-Local.ps1 has syntax errors' }
      - name: Install Qt 6.8.3
        run: |
          python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE -ne 0) { throw 'aqtinstall installation failed' }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP/Qt" --modules qtmultimedia
          if ($LASTEXITCODE -ne 0) { throw 'Qt installation failed' }
          $qt = "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64"
          "QT_ROOT_DIR=$qt" | Out-File $env:GITHUB_ENV -Append
          "$qt/bin" | Out-File $env:GITHUB_PATH -Append
      - name: Fetch and verify LGPL codec runtime
        run: |
          $bin = ./tools/Get-FFmpeg.ps1
          "FFMPEG_BIN=$bin" | Out-File $env:GITHUB_ENV -Append
          $bin | Out-File $env:GITHUB_PATH -Append
      - name: Fetch and verify AI runtime and model
        run: |
          $ort = ./tools/Get-OnnxRuntime.ps1
          "ONNXRUNTIME_DIR=$ort" | Out-File $env:GITHUB_ENV -Append
          $models = ./tools/Get-Models.ps1
          "MODELS_DIR=$models" | Out-File $env:GITHUB_ENV -Append
          $piper = ./tools/Get-Piper.ps1
          "PIPER_DIR=$piper" | Out-File $env:GITHUB_ENV -Append
      - name: Fetch and verify recorded sound effects
        run: |
          $sounds = ./tools/Get-Sounds.ps1
          "SOUNDS_DIR=$sounds" | Out-File $env:GITHUB_ENV -Append
      - name: Restore speech recognition build
        id: whisper-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .deps/whisper/bin
          key: whisper-${{ hashFiles('tools/Get-Whisper.ps1', 'tools/Get-VulkanSdk.ps1') }}
      - name: Install Vulkan SDK (build tool for whisper.cpp)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          $vulkan = ./tools/Get-VulkanSdk.ps1
          "VULKAN_SDK=$vulkan" | Out-File $env:GITHUB_ENV -Append
      - name: Build speech recognition (whisper.cpp)
        run: |
          $whisper = ./tools/Get-Whisper.ps1
          "WHISPER_DIR=$whisper" | Out-File $env:GITHUB_ENV -Append
      - name: Configure and compile
        run: |
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" "-DCUTLERY_ONNXRUNTIME_DIR=$env:ONNXRUNTIME_DIR" "-DCUTLERY_WHISPER_CLI=$env:WHISPER_DIR/whisper-cli.exe" "-DCUTLERY_TEST_MODELS=$env:MODELS_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Configuration failed' }
          cmake --build build --config Release --parallel 2 2>&1 | Tee-Object -FilePath build/compile.log
          if ($LASTEXITCODE -ne 0) {
            # The first compiler errors as annotations on the run.
            Select-String -Path build/compile.log -Pattern ': (fatal )?error ' | Select-Object -First 10 |
              ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
            throw 'Build failed'
          }
      - name: Test model and actual media rendering
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          $env:CUTLERY_TEST_SOUNDS = $env:SOUNDS_DIR
          $env:CUTLERY_TEST_PIPER = "$env:PIPER_DIR/piper.exe"
          $env:CUTLERY_TEST_VOICES = $env:MODELS_DIR
          ctest --test-dir build -C Release --output-on-failure 2>&1 | Tee-Object -FilePath build/ctest.log
          if ($LASTEXITCODE -ne 0) {
            # What failed in this first run, as annotations: a check that fails only now and
            # then passes again in the runs below.
            Select-String -Path build/ctest.log -Pattern 'FAIL!|Loc: \[|\*\*\*Failed|\*\*\*Timeout|\*\*\*Exception|Actual|Expected' |
              Select-Object -First 12 | ForEach-Object { Write-Output "::error::ctest: $($_.Line.Trim())" }
            # Show the failing checks directly; CTest's captured output can be empty here.
            $env:QT_QPA_FONTDIR = "$env:WINDIR/Fonts"
            build/bin/Release/cutlery_tests.exe -o build/engine.txt,txt -o -,txt | Out-Null
            Write-Output "Engine tests exit code: $LASTEXITCODE"
            build/bin/Release/cutlery_ui_tests.exe -o build/ui.txt,txt | Out-Null
            Write-Output "Interface tests exit code: $LASTEXITCODE"
            # Each failing check, with its location, as an annotation on the run.
            foreach ($file in 'build/engine.txt', 'build/ui.txt') {
              if (!(Test-Path $file)) { Write-Output "::error::$file was not written (the test program crashed?)"; continue }
              $lines = @(Get-Content $file)
              Get-Content $file | Select-String -NotMatch '^PASS'
              for ($i = 0; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match '^FAIL!') {
                  $detail = ($lines[($i + 1)..([Math]::Min($i + 3, $lines.Count - 1))] -join ' ').Trim()
                  Write-Output "::error::$($lines[$i]) $detail"
                }
              }
            }
            throw 'Tests failed'
          }
          # Text to speech ran with the real Piper and voice, not skipped.
          $speech = build/bin/Release/cutlery_tests.exe textToSpeech 2>&1 | Out-String
          if ($speech -notmatch 'PASS   : EngineTest::textToSpeech\(\)') { Write-Output $speech; throw 'Text to speech was not tested with Piper' }
          $p = Start-Process build/bin/Release/Cutlery.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'QML startup failed' }
      - name: Check the real models on a test video
        run: |
          ffmpeg -v error -f lavfi -i "testsrc2=s=320x240:r=8:d=1" -c:v ffv1 build/test.mkv
          if ($LASTEXITCODE -ne 0) { throw 'Test video failed' }
          $ff = (Get-Command ffmpeg).Source
          build/bin/Release/cutlery-ai.exe matte --ffmpeg $ff --model "$env:MODELS_DIR/u2net_human_seg.onnx" --input build/test.mkv --output build/test-matte.mkv --size 320x240 --duration 1
          if ($LASTEXITCODE -ne 0) { throw 'Matte inference failed' }
          build/bin/Release/cutlery-ai.exe upscale --ffmpeg $ff --model "$env:MODELS_DIR/realesr-general-x4v3.onnx" --input build/test.mkv --output build/test-up.mov --source 320x240 --size 1280x960 --rate 8/1 --duration 0.5
          if ($LASTEXITCODE -ne 0) { throw 'Upscale inference failed' }
          # The same on the CPU provider, which every machine has.
          build/bin/Release/cutlery-ai.exe upscale --ffmpeg $ff --model "$env:MODELS_DIR/realesr-general-x4v3.onnx" --input build/test.mkv --output build/test-up-cpu.mov --source 320x240 --size 1280x960 --rate 8/1 --duration 0.25 --cpu 1
          if ($LASTEXITCODE -ne 0) { throw 'CPU upscale failed' }
          ffprobe -v error -show_entries stream=width,height,codec_name,nb_frames -of compact build/test-up.mov
          # Eye contact on the CPU provider with the converted MediaPipe models.
          ffmpeg -v error -loop 1 -i tests/fixtures/face-side.jpg -t 0.5 -r 10 -c:v ffv1 build/face.mkv
          build/bin/Release/cutlery-ai.exe eyecontact --ffmpeg $ff --model "$env:MODELS_DIR/face_landmark.onnx" --input build/face.mkv --output build/face-fixed.mov --source 640x360 --rate 10/1 --cpu 1 --report build/face-report.txt
          if ($LASTEXITCODE -ne 0) { throw 'Eye contact failed' }
          Get-Content build/face-report.txt -Tail 2
      - name: Check speech recognition on synthesized speech
        timeout-minutes: 20
        run: |
          # Windows text-to-speech says a known sentence; the captions must contain its words.
          $tts = Start-Job { param($out) Add-Type -AssemblyName System.Speech; $s = New-Object System.Speech.Synthesis.SpeechSynthesizer; $s.Rate = -1; $s.SetOutputToWaveFile($out); $s.Speak('Welcome to Cutlery. This video editor works on your own computer.'); $s.Dispose() } -ArgumentList (Join-Path $PWD 'build/speech.wav') -PSVersion 5.1
          if (!(Wait-Job $tts -Timeout 120)) { Stop-Job $tts; Write-Warning 'Text-to-speech timed out; skipping the speech check'; exit 0 }
          Receive-Job $tts
          if (!(Test-Path build/speech.wav) -or (Get-Item build/speech.wav).Length -lt 10000) { Write-Warning 'No text-to-speech voice on this runner; skipping the speech check'; exit 0 }
          ffprobe -v error -show_entries format=duration -of csv=p=0 build/speech.wav
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process build/bin/Release/cutlery-ai.exe -NoNewWindow -PassThru -RedirectStandardOutput build/speech-out.txt -RedirectStandardError build/speech-err.txt -ArgumentList @('transcribe', '--ffmpeg', (Get-Command ffmpeg).Source, '--whisper', "$env:WHISPER_DIR/whisper-cli.exe", '--model', "$env:MODELS_DIR/ggml-large-v3-turbo-q5_0.bin", '--vad', "$env:WHISPER_DIR/ggml-silero-v6.2.0.bin", '--input', 'build/speech.wav', '--output', 'build/speech.srt', '--language', 'en')
          $null = $p.Handle # keeps the exit code readable after the process ends
          $done = $p.WaitForExit(300000)
          Write-Output "Transcription took $($watch.Elapsed.TotalSeconds) s"
          Get-Content build/speech-out.txt -Tail 5
          Get-Content build/speech-err.txt -Tail 15
          if (!$done) { $p.Kill(); throw 'Transcription timed out' }
          if ($p.ExitCode -ne 0) { throw 'Transcription failed' }
          # No GPU on the runner: the Vulkan backend finds no device and the CPU runs.
          if ((Get-Content build/speech-out.txt) -notcontains 'device cpu') { throw 'Expected the CPU fallback on this runner' }
          $text = Get-Content build/speech.srt -Raw
          Write-Output $text
          # One cue per word: check the words, and that each cue holds a single word.
          foreach ($word in @('Cutlery', 'video', 'editor', 'computer')) { if ($text -notmatch $word) { throw "Transcript misses '$word'" } }
          $long = ($text -split "`r?`n") | Where-Object { $_ -match '\S\s+\S' -and $_ -notmatch '-->' }
          if ($long) { throw "Expected one word per cue: $long" }
      - name: Package portable application
        run: |
          ./tools/Package-Windows.ps1 -QtRoot $env:QT_ROOT_DIR -FFmpegBin $env:FFMPEG_BIN -OnnxRuntime $env:ONNXRUNTIME_DIR -Models $env:MODELS_DIR -Whisper $env:WHISPER_DIR -Sounds $env:SOUNDS_DIR -Piper $env:PIPER_DIR
      - name: Smoke-test deployed executable
        env:
          QT_QUICK_BACKEND: software
        run: |
          $env:QT_PLUGIN_PATH = ''
          $env:QML2_IMPORT_PATH = ''
          $env:QML_IMPORT_PATH = ''
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          $exe = Resolve-Path dist/Cutlery-0.5.0-win64-portable/Cutlery.exe
          $p = Start-Process $exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Deployed application failed' }
          if ((Get-Content "$(Split-Path $exe)/sounds/sounds.json" -Raw | ConvertFrom-Json).Count -lt 6) { throw 'Sound effects missing from the package' }
          # The deployed worker starts with only the packaged DLLs.
          $dist = Split-Path $exe
          & "$dist/cutlery-ai.exe" matte --ffmpeg "$dist/codecs/ffmpeg.exe" --model "$env:MODELS_DIR/u2net_human_seg.onnx" --input build/test.mkv --output build/deployed-matte.mkv --size 320x240 --duration 1
          if ($LASTEXITCODE -ne 0) { throw 'Deployed AI worker failed' }
          # whisper-cli with the packaged runtime only, on whisper.cpp's small test model.
          & "$dist/codecs/ffmpeg.exe" -v error -y -f lavfi -i "sine=d=1" -ar 16000 -ac 1 build/tone.wav
          & "$dist/whisper-cli.exe" -np -m tests/fixtures/whisper-for-tests-tiny.bin -f build/tone.wav
          if ($LASTEXITCODE -ne 0) { throw 'Deployed whisper-cli failed' }
          foreach ($dll in 'ggml-vulkan.dll', 'ggml-cpu-x64.dll', 'ggml-cpu-haswell.dll', 'vcomp140.dll') { if (!(Test-Path "$dist/$dll")) { throw "$dll missing from the package" } }
          # Piper from the AI pack speaks German with the packaged voice.
          $pack = Resolve-Path dist/Cutlery-0.5.0-AI-pack
          Push-Location "$pack/models"
          'Grüße aus dem Schnittprogramm.' | & "$pack/tts/piper.exe" --quiet --model de_DE-thorsten-medium.onnx --output_file "$PWD/../../tts-check.wav"
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0 -or (Get-Item dist/tts-check.wav).Length -lt 20000) { throw 'Packaged Piper failed' }
      # The one-command local build (README/BUILDING) must keep working; the downloads and the
      # build folder from the steps above are reused, so this mostly checks the script itself.
      - name: Check the local build script
        run: |
          python --version
          # The error message as an annotation, since job logs are not always at hand.
          try { ./tools/Build-Local.ps1 -SkipTests -QtRoot $env:QT_ROOT_DIR } catch { Write-Output "::error::Build-Local.ps1: $($_.Exception.Message) at $($_.InvocationInfo.PositionMessage -replace '\r?\n', ' ')"; throw }
      # Builds are uploaded only from a manual run with "upload" ticked: each one stores about
      # 870 MB, more than the free Actions storage. Build locally with tools/Build-Local.ps1.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch' && inputs.upload
        with:
          name: Cutlery-0.5.0-win64-portable
          path: dist/Cutlery-0.5.0-win64-portable/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch' && inputs.upload
        with:
          name: Cutlery-0.5.0-AI-pack
          path: dist/Cutlery-0.5.0-AI-pack/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: Windows-test-logs
          path: build/Testing/Temporary/
          retention-days: 3
